; PlatformIO Project Configuration File
;
; NekoPaw — AI-IoT Bridge for ESP32
; Example project that builds the local NekoPaw library (../..).

[platformio]
core_dir = ${sysenv.HOME}/.pio_core_nekopaw
build_dir = ${sysenv.HOME}/.pio_build_nekopaw
default_envs = airm2m_core_esp32c3
extra_configs =
  platformio_override.ini

[env]
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DNEKOPAW_ENABLE_LOG=1
lib_extra_dirs =
  ../..
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  mathertel/OneButton@^2.5.0
  zinggjm/GxEPD2@^1.6.5
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit BusIO@^1.17.4

[env:airm2m_core_esp32c3]
platform = espressif32
board = airm2m_core_esp32c3
; Optional local file (gitignored):
; [env:airm2m_core_esp32c3]
; build_flags =
;   ${env.build_flags}
;   -DNEKOPAW_WIFI_SSID=\"your-wifi-ssid\"
;   -DNEKOPAW_WIFI_PASSWORD=\"your-wifi-password\"
